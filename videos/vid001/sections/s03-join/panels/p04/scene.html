<!doctype html>
<html data-composition-variables='[
  {"id":"date","type":"string","label":"Date","default":"TBA"},
  {"id":"venue","type":"string","label":"Venue","default":"TBA"}
]'>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../../../../../_config/tokens.css">
  <style>
    html, body { margin: 0; background: var(--ink); }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
    .still { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #still-text { clip-path: inset(0 0 1250px 0); }
    #still-circle { clip-path: circle(540px at 540px 1200px); }
    #logo { position: absolute; left: 140px; top: 70px; width: 800px; height: 800px; }
    #tagline { position: absolute; left: 0; top: 690px; width: 100%; margin: 0; text-align: center; font: 400 96px/1.1 var(--font-display); color: var(--ivory); }
    #details { position: absolute; left: 0; top: 940px; width: 100%; text-align: center; font: 500 40px/1.45 var(--font-text); color: var(--ivory); }
    #details span { color: #B5B3AC; }
    #qr { position: absolute; left: 380px; top: 1095px; width: 320px; height: 320px; border-radius: 16px; }
    #link { position: absolute; left: 0; top: 1447px; width: 100%; text-align: center; font: 500 34px/1 var(--font-text); color: var(--coral); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="root" data-start="0" data-duration="4.5" data-fps="30" data-width="1080" data-height="1920">
    <img class="still" id="still-text" src="assets/from-previous.png" alt="">
    <img class="still" id="still-circle" src="assets/from-previous.png" alt="">
    <img id="logo" src="assets/logo.png" alt="Claude Builder Club, University of Ghana">
    <h1 id="tagline">Come build<br>with Claude.</h1>
    <div id="details"><div id="date"></div><div id="venue"></div></div>
    <img id="qr" src="assets/qr.png" alt="QR code for the club sign-up form">
    <div id="link">Link in caption</div>
  </div>

  <script src="../../../../../../library/vendor/gsap.min.js"></script>
  <script>
    const { date, venue } = window.__hyperframes.getVariables();
    document.getElementById("date").innerHTML = `<span>Date</span>&ensp;${date}`;
    document.getElementById("venue").innerHTML = `<span>Venue</span>&ensp;${venue}`;

    const tl = gsap.timeline({ paused: true });

    tl.set(["#logo", "#tagline", "#details", "#qr", "#link"], { opacity: 0 }, 0);

    // The circle closes as it travels up into the logo's mark. The picture moves with it,
    // so the headline in the still never shows inside the circle.
    tl.to("#still-text", { opacity: 0, duration: 0.35, ease: "power1.in" }, 0);
    tl.to("#still-circle", { clipPath: "circle(0px at 540px 1200px)", y: -919, duration: 0.95, ease: "power2.inOut" }, 0);

    const rise = (target, at) => tl.fromTo(target, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, at);
    tl.fromTo("#logo", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.out" }, 0.8);
    rise("#tagline", 1.15);
    rise("#details", 1.5);
    rise("#qr", 1.8);
    rise("#link", 2.05);

    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
  </script>
</body>
</html>
