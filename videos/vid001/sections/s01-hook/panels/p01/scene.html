<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../../../../../_config/tokens.css">
  <style>
    html, body { margin: 0; background: var(--ivory); }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ivory); }
    .layer { position: absolute; left: -300px; top: 0; width: 1680px; height: 1920px; }
    .layer div { position: absolute; }
    .arch { background: var(--sand); border-radius: 260px 260px 0 0; }
    .disc { background: var(--coral); border-radius: 50%; }
    #ground { position: absolute; left: 0; top: 1500px; width: 1080px; height: 2px; background: var(--ink); }
    #mover { position: absolute; left: 0; top: 598px; width: 520px; height: 919px; }
    .character { width: 100%; height: 100%; overflow: visible; }
    #eyebrow { position: absolute; left: 90px; top: 290px; margin: 0; font: 500 26px/1 var(--font-text); letter-spacing: 0.16em; text-transform: uppercase; color: var(--grey); }
    #headline { position: absolute; left: 90px; top: 350px; margin: 0; font: 400 136px/1.06 var(--font-display); color: var(--ink); }
    #headline span { display: block; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="root" data-start="0" data-duration="3.5" data-fps="30" data-width="1080" data-height="1920">
    <div id="far" class="layer">
      <div class="arch" style="left:880px;top:800px;width:520px;height:700px"></div>
      <div class="disc" style="left:1200px;top:300px;width:120px;height:120px"></div>
    </div>
    <div id="ground"></div>
    <div id="mover"></div>
    <p id="eyebrow">Claude Builder Club</p>
    <h1 id="headline"><span id="line1">Hey,</span><span id="line2">builder.</span></h1>
  </div>

  <script src="../../../../../../library/vendor/gsap.min.js"></script>
  <script src="../../../../../../packs/flat-people/lib/character.js"></script>
  <script src="../../../../../../packs/flat-people/lib/cast.js"></script>
  <script>
    const mover = document.getElementById("mover");
    const ama = FlailRig.createCharacter(mover, FlailCast.ama);

    const tl = gsap.timeline({ paused: true });

    // Slow camera drift across the whole panel.
    tl.fromTo("#far", { x: 130 }, { x: -30, duration: 3.5, ease: "sine.out" }, 0);

    const walked = FlailRig.walk(tl, ama, mover, { start: 0, duration: 2.2, strides: 2, fromX: -270 });
    FlailRig.wave(tl, ama, walked - 0.25, 2, 0.5);
    FlailRig.blink(tl, ama, 2.3);

    tl.fromTo("#line1", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 1, ease: "power2.out" }, 0.25);
    tl.fromTo("#line2", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 1, ease: "power2.out" }, 0.55);

    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
  </script>
</body>
</html>
