<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../../../../../_config/tokens.css">
  <style>
    html, body { margin: 0; background: var(--ivory); }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ivory); }
    #far, #world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 1500px; }
    .arch { position: absolute; background: var(--sand); border-radius: 260px 260px 0 0; }
    #disc { position: absolute; left: 810px; top: 300px; width: 120px; height: 120px; background: var(--coral); border-radius: 50%; }
    #ground { position: absolute; left: 0; top: 1500px; width: 1080px; height: 2px; background: var(--ink); }
    .mover { position: absolute; left: 0; top: 598px; width: 520px; height: 919px; }
    .character { width: 100%; height: 100%; overflow: visible; }
    .character.flip { transform: scaleX(-1); }

    /* The dark frame is a huge shadow around a circle, so one scale closes it. */
    #iris { position: absolute; left: 0; top: 660px; width: 1080px; height: 1080px; border-radius: 50%; box-shadow: 0 0 0 2400px var(--ink); }

    #laptop { position: absolute; left: 150px; top: 1040px; width: 780px; height: 460px; scale: 0.86; transform-origin: 50% 100%; }
    #lid { position: absolute; left: 30px; top: 0; width: 720px; height: 440px; box-sizing: border-box; padding: 16px; border-radius: 22px 22px 0 0; background: #2E2E2B; }
    #screen { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 8px; background: var(--ink); }
    #deck { position: absolute; left: 0; top: 440px; width: 780px; height: 20px; border-radius: 0 0 16px 16px; background: var(--grey); }
    #prompt { position: absolute; left: 30px; top: 28px; font: 500 30px/1 var(--font-text); color: var(--ivory); }
    #prompt i { font-style: normal; color: var(--coral); margin-right: 14px; }
    .bar { position: absolute; left: 30px; height: 14px; border-radius: 7px; background: var(--grey); transform-origin: 0 50%; }
    .bar.hot { background: var(--coral); }
    #page { position: absolute; left: 332px; top: 92px; width: 322px; height: 290px; border-radius: 10px; background: var(--ivory); overflow: hidden; }
    #page div { position: absolute; }
    #p-head { left: 0; top: 0; width: 100%; height: 66px; background: var(--sand); }
    #p-dot { left: 20px; top: 21px; width: 24px; height: 24px; border-radius: 50%; background: var(--coral); }
    #p-title { left: 20px; top: 88px; font: 400 42px/1 var(--font-display); color: var(--ink); }
    #p-line { left: 20px; top: 150px; width: 210px; height: 12px; border-radius: 6px; background: var(--sand-deep); }
    #p-button { left: 20px; top: 192px; width: 150px; height: 64px; border-radius: 8px; background: var(--ink); font: 500 28px/64px var(--font-text); color: var(--ivory); text-align: center; }

    #eyebrow { position: absolute; left: 90px; top: 290px; margin: 0; font: 500 26px/1 var(--font-text); letter-spacing: 0.16em; text-transform: uppercase; color: var(--grey); }
    .headline { position: absolute; left: 90px; top: 350px; margin: 0; font: 400 136px/1.06 var(--font-display); color: var(--ink); }
    .headline span { display: block; }
    .on-dark { color: var(--ivory); }
    .on-dark em { font-style: normal; color: var(--coral); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="root" data-start="0" data-duration="4" data-fps="30" data-width="1080" data-height="1920">
    <div id="far">
      <div class="arch" style="left:550px;top:800px;width:520px;height:700px"></div>
      <div class="arch" style="left:1500px;top:960px;width:420px;height:540px"></div>
    </div>
    <div id="disc"></div>
    <div id="ground"></div>
    <div id="world">
      <div class="mover" id="m-yaw" style="left:1740px"></div>
      <div class="mover" id="m-esi" style="left:1440px"></div>
      <div class="mover" id="m-kofi" style="left:1130px"></div>
      <div class="mover" id="m-ama"></div>
    </div>
    <div id="laptop">
      <div id="lid"><div id="screen">
        <div id="prompt"><i>&rsaquo;</i><span id="typed"></span></div>
        <div id="bars"></div>
        <div id="page">
          <div id="p-head"></div><div id="p-dot"></div>
          <div id="p-title">Sign up</div><div id="p-line"></div><div id="p-button">Join</div>
        </div>
      </div></div>
      <div id="deck"></div>
    </div>
    <div id="iris"></div>
    <p id="eyebrow">Claude Builder Club</p>
    <h1 class="headline" id="crew"><span>Meet your</span><span>crew.</span></h1>
    <h1 class="headline on-dark" id="watch"><span>Watch Claude</span><span>build.</span></h1>
    <h1 class="headline on-dark" id="yours"><span>Then build</span><span><em>yours.</em></span></h1>
  </div>

  <script src="../../../../../../library/vendor/gsap.min.js"></script>
  <script src="../../../../../../library/rig/character.js"></script>
  <script src="../../../../../../_config/cast.js"></script>
  <script>
    const R = FlailRig;
    const place = (id, config, flip) => R.createCharacter(document.getElementById(id), { ...config, flip });
    const ama = place("m-ama", FlailCast.ama, false);
    const kofi = place("m-kofi", FlailCast.kofi, true);
    const esi = place("m-esi", FlailCast.esi, false);
    const yaw = place("m-yaw", FlailCast.yaw, true);
    const crew = [ama, kofi, esi, yaw];

    const typed = document.getElementById("typed");
    const PROMPT = "Build a sign-up page";
    typed.innerHTML = [...PROMPT].map((ch) => `<span class="ch">${ch === " " ? "&nbsp;" : ch}</span>`).join("");

    const bars = document.getElementById("bars");
    [[230, 0], [170, 1], [250, 0], [140, 0], [210, 1], [180, 0], [120, 0]].forEach(([w, hot], i) => {
      bars.innerHTML += `<div class="bar${hot ? " hot" : ""}" style="top:${100 + i * 38}px;width:${w}px"></div>`;
    });

    const tl = gsap.timeline({ paused: true });

    // Matches p02's last frame so the cut between panels doesn't show.
    [ama, kofi, yaw].forEach((c) => R.stand(tl, c, 0));
    // Esi's near arm starts mid-gesture, so stand() must not touch it.
    tl.set(esi.parts.upperB, { rotation: -8 }, 0).set(esi.parts.foreB, { rotation: -6 }, 0);
    tl.set("#m-ama", { x: 848.67 }, 0);
    [kofi, yaw].forEach((c) => {
      tl.set(c.parts.head, { rotation: -6 }, 0).set(c.parts.torso, { rotation: -1.5 }, 0);
    });
    tl.set(yaw.parts.body, { y: -6 }, 0);
    tl.set("#far", { x: -330, scale: 0.86 }, 0);
    tl.set("#laptop", { y: 900 }, 0);
    tl.set("#watch", { opacity: 0 }, 0).set("#yours", { opacity: 0 }, 0);
    tl.set("#page", { opacity: 0, y: 16 }, 0);
    tl.set(".ch", { opacity: 0 }, 0);
    tl.set(".bar", { scaleX: 0 }, 0);

    // The scene closes to a circle on dark, then settles in slowly.
    tl.fromTo("#iris", { scale: 2.5 }, { scale: 1, duration: 1.05, ease: "power2.inOut" }, 0);
    tl.fromTo("#world", { x: -600, scale: 0.72 }, { x: -679, scale: 0.78, duration: 4, ease: "sine.out" }, 0);
    tl.to("#crew", { opacity: 0, y: -14, duration: 0.35, ease: "power1.in" }, 0);
    tl.to("#eyebrow", { color: "#B5B3AC", duration: 0.5, ease: "sine.inOut" }, 0.45);

    // The crew settle and look down at the laptop.
    tl.fromTo(esi.parts.upperA, { rotation: -32 }, { rotation: 0, duration: 0.8, ease: "sine.inOut" }, 0.1);
    tl.fromTo(esi.parts.foreA, { rotation: -54 }, { rotation: -6, duration: 0.8, ease: "sine.inOut" }, 0.1);
    tl.to(yaw.parts.body, { y: 0, duration: 0.5, ease: "sine.inOut" }, 0);
    crew.forEach((c, i) => {
      const at = 0.8 + i * 0.09;
      tl.to(c.parts.head, { rotation: 8, duration: 0.8, ease: "sine.inOut" }, at);
      tl.to(c.parts.torso, { rotation: 2, duration: 0.8, ease: "sine.inOut" }, at);
    });
    R.blink(tl, ama, 2.4);
    R.blink(tl, yaw, 3.1);

    tl.to("#laptop", { y: 0, duration: 0.95, ease: "power3.out" }, 0.4);

    // Claude builds: the prompt types out, code appears, then the page assembles.
    tl.to(".ch", { opacity: 1, duration: 0.01, stagger: 0.034 }, 1.05);
    tl.to(".bar", { scaleX: 1, duration: 0.3, ease: "power2.out", stagger: 0.09 }, 1.8);
    tl.to("#page", { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 2.45);

    tl.fromTo("#watch", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.95);
    tl.to("#watch", { opacity: 0, y: -14, duration: 0.3, ease: "power1.in" }, 2.55);
    tl.fromTo("#yours", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 2.85);

    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
  </script>
</body>
</html>
