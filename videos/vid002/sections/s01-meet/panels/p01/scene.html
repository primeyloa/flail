<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../../../../../_config/tokens.css">
  <style>
    html, body { margin: 0; background: var(--ivory); }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ivory); }
    #far { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #far > div { position: absolute; }
    #distant { position: absolute; left: 0; top: 0; overflow: visible; }
    #ground { position: absolute; left: 0; top: 1500px; width: 1080px; height: 2px; background: var(--ink); }
    .sprite { position: absolute; top: 1300px; width: 360px; height: 240px; }
    #balloon { position: absolute; left: 910px; top: 1398px; width: 0; height: 0; transform-origin: 0 0; }
    #string { position: absolute; left: -2px; top: -320px; width: 4px; height: 320px; background: var(--ink); }
    #bag { position: absolute; left: -66px; top: -474px; width: 132px; height: 160px; border-radius: 50% 50% 48% 48%; background: var(--coral); }
    .glass { background: linear-gradient(165deg, rgba(255,255,255,0.3), rgba(255,255,255,0.04) 42%, rgba(255,255,255,0.14)); box-shadow: inset 0 2px 2px rgba(255,255,255,0.95), inset 0 -2px 2px rgba(255,255,255,0.5), inset 0 0 0 1.5px rgba(255,255,255,0.4), 0 26px 60px rgba(20,20,19,0.16); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="root" data-start="0" data-duration="6" data-fps="30" data-width="1080" data-height="1920">
    <div id="far">
      <div style="left:640px;top:880px;width:640px;height:620px;border-radius:320px 320px 0 0;background:var(--sand)"></div>
      <div style="left:-180px;top:1060px;width:560px;height:440px;border-radius:280px 280px 0 0;background:var(--sand)"></div>
      <div style="left:690px;top:430px;width:300px;height:300px;border-radius:50%;background:var(--coral)"></div>
      <svg id="distant" width="10" height="10">
        <path d="M-300 1220 C 60 480, 330 470, 560 860 S 1020 1460, 1500 420" fill="none" stroke="#B5B3AC" stroke-width="10" stroke-linecap="round"/>
      </svg>
    </div>
    <div id="ground"></div>
    <div class="sprite" id="walker"></div>
    <div class="sprite" id="holder" style="left:600px"></div>
    <div id="balloon"><div id="string"></div><div id="bag"></div></div>
  </div>

  <script src="../../../../../../library/vendor/gsap.min.js"></script>
  <script src="../../../../../../packs/mascot-ride/lib/clawd.js"></script>
  <script src="../../../../../../packs/mascot-ride/lib/glass.js"></script>
  <script>
    const root = document.getElementById("root");
    const walker = FlailClawd.create(document.getElementById("walker"), ["step-left", "step-right", "default", "facing-right-12", "facing-right-30", "blink"]);
    const holder = FlailClawd.create(document.getElementById("holder"), ["default", "look-left", "facing-left-12", "facing-left-30", "blink"]);

    const offer = FlailGlass.create(root, { x: 120, y: 520, w: 840, h: 340, lines: ["Fancy", "something fun?"] });
    const reply = FlailGlass.create(root, { x: 60, y: 930, w: 620, h: 210, lines: ["Like what?"] });

    const tl = gsap.timeline({ paused: true });

    // Background drifts so the glass has something moving behind it.
    tl.fromTo("#far", { x: 50 }, { x: -70, duration: 6, ease: "sine.inOut" }, 0);

    // Whole-frame steps: the walker moves between poses, never bends.
    tl.fromTo("#walker", { x: -330 }, { x: 110, duration: 1.5, ease: "power1.out" }, 0);
    FlailClawd.walk(tl, walker, 0, 1.5, 0.22);
    FlailClawd.pose(tl, walker, "facing-right-12", 1.6);
    FlailClawd.pose(tl, walker, "facing-right-30", 1.72);

    FlailClawd.pose(tl, holder, "look-left", 0.7);
    FlailClawd.pose(tl, holder, "facing-left-12", 1.45);
    FlailClawd.pose(tl, holder, "facing-left-30", 1.57);

    // The balloon sways gently and dips as the holder talks.
    tl.fromTo("#balloon", { rotation: -4 }, { rotation: 5, duration: 1.5, ease: "sine.inOut" }, 0);
    tl.to("#balloon", { rotation: -4, duration: 1.5, ease: "sine.inOut" }, 1.5);
    tl.to("#balloon", { rotation: 5, duration: 1.5, ease: "sine.inOut" }, 3);
    tl.to("#balloon", { rotation: -2, duration: 1.5, ease: "sine.inOut" }, 4.5);

    FlailGlass.show(tl, [offer], 1.9, 5.85);
    FlailGlass.show(tl, [reply], 3.6, 5.85);

    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
  </script>
</body>
</html>
