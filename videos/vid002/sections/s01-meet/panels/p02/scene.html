<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../../../../../_config/tokens.css">
  <style>
    html, body { margin: 0; background: var(--ivory); }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ivory); }
    #far { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #far > div { position: absolute; }
    #distant { position: absolute; left: 0; top: 0; overflow: visible; }
    #world { position: absolute; left: 0; top: 0; width: 10px; height: 10px; transform-origin: 0 0; }
    #ground { position: absolute; left: -2000px; top: 2700px; width: 6000px; height: 2px; background: var(--ink); }
    .sprite { position: absolute; top: 2500px; width: 360px; height: 240px; }
    #hand-balloon { position: absolute; left: 410px; top: 2598px; width: 0; height: 0; transform-origin: 0 0; }
    #string { position: absolute; left: -2px; top: -320px; width: 4px; height: 320px; background: var(--ink); }
    #bag { position: absolute; left: -66px; top: -474px; width: 132px; height: 160px; border-radius: 50% 50% 48% 48%; background: var(--coral); }
    .glass { background: linear-gradient(165deg, rgba(255,255,255,0.3), rgba(255,255,255,0.04) 42%, rgba(255,255,255,0.14)); box-shadow: inset 0 2px 2px rgba(255,255,255,0.95), inset 0 -2px 2px rgba(255,255,255,0.5), inset 0 0 0 1.5px rgba(255,255,255,0.4), 0 26px 60px rgba(20,20,19,0.16); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="root" data-start="0" data-duration="2.5" data-fps="30" data-width="1080" data-height="1920">
    <div id="far">
      <div style="left:640px;top:880px;width:640px;height:620px;border-radius:320px 320px 0 0;background:var(--sand)"></div>
      <div style="left:-180px;top:1060px;width:560px;height:440px;border-radius:280px 280px 0 0;background:var(--sand)"></div>
      <div style="left:690px;top:430px;width:300px;height:300px;border-radius:50%;background:var(--coral)"></div>
      <svg id="distant" width="10" height="10">
        <path d="M-300 1220 C 60 480, 330 470, 560 860 S 1020 1460, 1500 420" fill="none" stroke="#B5B3AC" stroke-width="10" stroke-linecap="round"/>
      </svg>
    </div>
    <div id="world">
      <div id="ground"></div>
      <div id="track-holder"></div>
      <div class="sprite" id="walker" style="left:-390px"></div>
      <div class="sprite" id="holder" style="left:100px"></div>
      <div id="hand-balloon"><div id="string"></div><div id="bag"></div></div>
    </div>
  </div>

  <script src="../../../../../../library/vendor/gsap.min.js"></script>
  <script src="../../../../../../packs/mascot-ride/lib/clawd.js"></script>
  <script src="../../../../../../packs/mascot-ride/lib/ride.js"></script>
  <script src="../../../../../../packs/mascot-ride/lib/glass.js"></script>
  <script>
    const root = document.getElementById("root");
    const world = document.getElementById("world");
    const R = FlailRide;

    const rail = R.buildTrack(document.getElementById("track-holder"));
    const supports = document.querySelector(".supports");
    const rider = R.buildCar(world);

    const walker = FlailClawd.create(document.getElementById("walker"), ["facing-right-30", "look-right"]);
    const holder = FlailClawd.create(document.getElementById("holder"), ["facing-left-30", "facing-left-12", "one-arm-up", "look-right"]);
    const riderA = FlailClawd.create(rider.seatA, ["default"]);
    const riderB = FlailClawd.create(rider.seatB, ["default"]);

    const that = FlailGlass.create(root, { x: 440, y: 590, w: 420, h: 200, lines: ["That."], fontSize: 92 });

    const tl = gsap.timeline({ paused: true });

    // Holder's start matches p01's last frame.
    tl.set(supports, { opacity: 0 }, 0);
    tl.set("#hand-balloon", { rotation: -2 }, 0);
    tl.set("#far", { x: -70 }, 0);

    FlailClawd.pose(tl, holder, "facing-left-12", 0.1);
    FlailClawd.pose(tl, holder, "one-arm-up", 0.22);
    FlailClawd.pose(tl, walker, "look-right", 0.45);

    FlailGlass.show(tl, [that], 0.2, 1.15);
    tl.to("#hand-balloon", { rotation: 4, duration: 1, ease: "sine.inOut" }, 0);

    // Whip up the coaster. The fast move hides the jump: they're already in the car at the top.
    const camera = { duration: 1.75, ease: "power2.inOut" };
    tl.fromTo(world, { x: 500, y: -1200, scale: 1 }, { x: 270, y: 572, scale: 0.9, ...camera }, 0.75);
    tl.to(supports, { opacity: 1, duration: 0.3, ease: "none" }, 0.8);
    tl.to("#far", { x: -200, y: 620, ...camera }, 0.75);
    tl.to("#distant", { opacity: 0, duration: 0.5, ease: "none" }, 0.9);

    // The car rolls in and reaches the crest at the end, at the speed p03 starts with.
    const crest = R.firstCrest(rail);
    const FRAMES = 75, SPEED = 170;
    for (let i = 0; i < FRAMES; i++) {
      const t = i / 30;
      const s = crest - SPEED * (2.5 - t);
      const p = rail.getPointAtLength(s), ahead = rail.getPointAtLength(s + 4);
      const angle = (Math.atan2(ahead.y - p.y, ahead.x - p.x) * 180) / Math.PI;
      if (i === 0) tl.set(rider.car, { x: p.x, y: p.y, rotation: angle }, 0);
      else tl.to(rider.car, { x: p.x, y: p.y, rotation: angle, duration: 1 / 30, ease: "none" }, t - 1 / 30);
      if (i === 0) tl.set(rider.balloon, { rotation: -angle - 6 }, 0);
      else tl.to(rider.balloon, { rotation: -angle - 6, duration: 1 / 30, ease: "none" }, t - 1 / 30);
    }

    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
  </script>
</body>
</html>
