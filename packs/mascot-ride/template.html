<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../../../../../_config/tokens.css">
  <style>
    html, body { margin: 0; background: var({{BG}}); }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var({{BG}}); }
    #headline { position: absolute; left: 90px; top: 350px; margin: 0; font: 400 136px/1.06 var(--font-display); color: var({{TEXT}}); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="root" data-start="0" data-duration="{{DURATION}}" data-fps="30" data-width="1080" data-height="1920">
    <h1 id="headline">Headline</h1>
  </div>

  <script src="../../../../../../library/vendor/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#headline", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 1, ease: "power2.out" }, 0.25);

    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
  </script>
</body>
</html>
