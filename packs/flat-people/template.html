<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../../../../../_config/tokens.css">
  <style>
    html, body { margin: 0; background: var({{BG}}); }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var({{BG}}); }
    #ground { position: absolute; left: 0; top: 1500px; width: 1080px; height: 2px; background: var({{TEXT}}); }
    .mover { position: absolute; left: 0; top: 598px; width: 520px; height: 919px; }
    .character { width: 100%; height: 100%; overflow: visible; }
    .character.flip { transform: scaleX(-1); }
    #eyebrow { position: absolute; left: 90px; top: 290px; margin: 0; font: 500 26px/1 var(--font-text); letter-spacing: 0.16em; text-transform: uppercase; color: var({{LABEL}}); }
    #headline { position: absolute; left: 90px; top: 350px; margin: 0; font: 400 136px/1.06 var(--font-display); color: var({{TEXT}}); }
    #headline span { display: block; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="root" data-start="0" data-duration="{{DURATION}}" data-fps="30" data-width="1080" data-height="1920">
    <div id="ground"></div>
    <div class="mover" id="m-lead"></div>
    <p id="eyebrow">Claude Builder Club</p>
    <h1 id="headline"><span>Headline</span></h1>
  </div>

  <script src="../../../../../../library/vendor/gsap.min.js"></script>
  <script src="../../../../../../packs/flat-people/lib/character.js"></script>
  <script src="../../../../../../packs/flat-people/lib/cast.js"></script>
  <script>
    const lead = FlailRig.createCharacter(document.getElementById("m-lead"), FlailCast.ama);
    const tl = gsap.timeline({ paused: true });

    FlailRig.stand(tl, lead, 0);
    tl.set("#m-lead", { x: 280 }, 0);
    tl.fromTo("#headline", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 1, ease: "power2.out" }, 0.25);

    window.__timelines = window.__timelines || {};
    window.__timelines["root"] = tl;
  </script>
</body>
</html>
